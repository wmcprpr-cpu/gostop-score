<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#176b45">
  <title>3인 고스톱 점수판</title>
  <style>
    :root{--bg:#f5f6f4;--card:#fff;--line:#d9ddd8;--text:#1c211e;--muted:#6c756f;--accent:#176b45;--accent2:#e8f3ed;--danger:#a23b3b}
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}
    .wrap{max-width:900px;margin:auto;padding:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
    h1{font-size:28px;margin:4px 0 12px;display:flex;align-items:center;gap:8px} h2{font-size:21px;margin:0 0 10px}.muted{font-size:16px;color:var(--muted);line-height:1.45}
    .hwatu{display:inline-flex;gap:2px;transform:rotate(-3deg);flex:0 0 auto}
    .hwatu i{display:inline-block;width:17px;height:27px;border:2px solid #222;border-radius:3px;background:#fff;box-shadow:1px 1px 0 #bbb}
    .hwatu i:first-child{background:linear-gradient(145deg,#fff 0 58%,#e43131 59% 100%)}
    .hwatu i:last-child{background:linear-gradient(35deg,#fff 0 52%,#111 53% 62%,#e43131 63% 100%);transform:rotate(10deg)}
    .names,.entry,.net{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
    label{font-size:15px;color:var(--muted)} input{width:100%;font-size:19px;border:1px solid var(--line);border-radius:10px;padding:11px 8px;background:#fff;color:var(--text)}
    .name{text-align:center;font-weight:700}.winner{border:1px solid var(--line);border-radius:12px;padding:9px;min-width:0}.winner strong{display:block;text-align:center;margin-bottom:8px;font-size:18px}
    .scorelabel{display:block;text-align:center;margin:7px 0}.scorelabel span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-bottom:4px}
    input[type=number]{text-align:center;font-weight:700;font-size:20px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
    button{min-height:46px;border:1px solid var(--line);border-radius:11px;background:#fff;padding:10px 14px;font-size:18px;font-weight:700;color:var(--text)}
    button.primary{background:var(--accent);border-color:var(--accent);color:#fff;flex:1}button:disabled{opacity:.45}.msg{min-height:22px;margin-top:8px;font-size:16px}
    .tablewrap{overflow-x:auto}table{border-collapse:collapse;width:100%;table-layout:fixed;font-size:15px;text-align:center}th,td{border:1px solid var(--line);padding:8px 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}thead th{background:#f1f4f2}tfoot td{font-weight:800;background:var(--accent2)}
    .settle{display:grid;gap:7px}.settle div{border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center;font-weight:700}
    .net>div{background:var(--accent2);border-radius:11px;padding:10px;text-align:center}.net small{display:block;color:var(--muted)}.net b{font-size:24px}
    .danger{color:var(--danger)}.foot{font-size:14px;color:var(--muted);text-align:center;padding:3px 0 12px}
    @media(max-width:480px){
.wrap{padding:7px}.card{padding:10px;border-radius:14px}.entry{gap:4px}.winner{padding:5px}
button{padding:8px;font-size:17px}.scorelabel{font-size:14px}
.tablewrap{overflow-x:visible}
table{min-width:0!important;font-size:13px}
th,td{padding:9px 1px;letter-spacing:-.4px}
.gameno{width:42px}
}
  
    .archiveRow{display:grid;grid-template-columns:92px 1fr auto;gap:8px;align-items:center;border-top:1px solid var(--line);padding:10px 0;font-size:15px}
    .archiveScores{display:flex;gap:8px;flex-wrap:wrap}
    .archiveScores b{white-space:nowrap}
    .archiveRow button{min-height:38px;padding:5px 9px;font-size:14px}
    @media(max-width:480px){.archiveRow{grid-template-columns:78px 1fr auto;font-size:14px}.archiveScores{gap:4px 8px}}
  </style>
</head>
<body>
<div class="wrap">
  <h1><span class="hwatu" aria-label="화투"><i></i><i></i></span> 3인 고스톱 점수판</h1><div class="muted" style="margin:-7px 0 10px">승자 점수만 입력하면 상대 점수·누적·상계가 자동 계산됩니다.</div>

  <section class="card">
    <h2>참가자</h2>
    <div class="names">
      <label>참가자 1<input class="name" data-name="0" value="나"></label>
      <label>참가자 2<input class="name" data-name="1" value="아내"></label>
      <label>참가자 3<input class="name" data-name="2" value="아들"></label>
    </div>
  </section>

  <section class="card">
    <div style="display:flex;justify-content:space-between;gap:8px;align-items:center">
      <h2>이번 게임 입력</h2><b id="round">1게임</b>
    </div>
    <div class="muted">이긴 사람 아래에서 상대 두 사람에게 받은 점수만 입력하세요. 반대 점수는 자동으로 마이너스 처리됩니다.</div>
    <div id="entry" class="entry" style="margin-top:10px"></div>
    <div id="msg" class="msg" aria-live="polite"></div>
    <button id="save" class="primary" type="button" disabled>이 게임 기록</button>
  </section>

  <section class="card">
    <div style="display:flex;justify-content:space-between;gap:8px;align-items:center">
      <h2>게임별 기록</h2><button id="undo" type="button" disabled>마지막 판 취소</button>
    </div>
    <div class="tablewrap"><table><thead id="head"></thead><tbody id="body"></tbody><tfoot id="foot"></tfoot></table></div>
  </section>

  <section class="card">
    <h2>현재 상계 결과</h2>
    <div id="settle" class="settle"></div>
    <div id="net" class="net" style="margin-top:10px"></div>
    <div class="actions"><button id="reset" type="button" class="danger" disabled>전체 기록 초기화</button></div>
  </section>
  <section class="card">
    <div style="display:flex;justify-content:space-between;gap:8px;align-items:center">
      <h2>게임 결과 보관함</h2>
      <button id="archiveSave" type="button">최종 결과 저장</button>
    </div>
    <div class="muted">날짜, 참가자 이름, 최종 점수만 저장합니다.</div>
    <div id="archiveList" style="margin-top:10px"></div>
  </section>
  <div class="foot">게임 기록·참가자 이름·최종 결과는 이 기기의 브라우저에 자동 저장됩니다.</div>
</div>

<script>
(() => {
  const $=s=>document.querySelector(s), names=[...document.querySelectorAll("[data-name]")];
  const entry=$("#entry"), head=$("#head"), body=$("#body"), foot=$("#foot"), settle=$("#settle"), net=$("#net"), msg=$("#msg"), round=$("#round"), save=$("#save"), undo=$("#undo"), reset=$("#reset");
  const pairs=[[0,1],[0,2],[1,0],[1,2],[2,0],[2,1]];
  let games=[], archives=[];
  const KEY="gostop3-score-v1", NAMEKEY="gostop3-names-v1", ARCHIVEKEY="gostop3-archives-v1";
  const archiveSave=$("#archiveSave"), archiveList=$("#archiveList");
  const nm=i=>names[i].value.trim()||["나","아내","아들"][i];
  const fmt=v=>v===0?"0":(v>0?"+":"")+v;
  function persist(){try{localStorage.setItem(KEY,JSON.stringify(games));localStorage.setItem(NAMEKEY,JSON.stringify(names.map(x=>x.value)));localStorage.setItem(ARCHIVEKEY,JSON.stringify(archives))}catch(e){}}
  function load(){try{const g=JSON.parse(localStorage.getItem(KEY)||"[]"),n=JSON.parse(localStorage.getItem(NAMEKEY)||"null");if(Array.isArray(g))games=g;if(Array.isArray(n)&&n.length===3)n.forEach((v,i)=>names[i].value=String(v||""));const a=JSON.parse(localStorage.getItem(ARCHIVEKEY)||"[]");if(Array.isArray(a))archives=a}catch(e){games=[];archives=[]}}
  function buildEntry(){
    entry.innerHTML="";
    for(let w=0;w<3;w++){
      const others=[0,1,2].filter(i=>i!==w), d=document.createElement("div"); d.className="winner";
      d.innerHTML="<strong>"+esc(nm(w))+" 승리</strong>"+others.map(l=>'<label class="scorelabel"><span>'+esc(nm(l))+'</span><input type="number" inputmode="numeric" min="0" max="99999" step="1" data-w="'+w+'" data-l="'+l+'" placeholder="0"></label>').join("");
      entry.appendChild(d);
    }
  }
  function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
  function totals(){const t=Array(6).fill(0);games.forEach(g=>g.forEach((v,i)=>t[i]+=Number(v)||0));return t}
  function renderArchive(){
    if(!archives.length){archiveList.innerHTML='<div class="muted">저장된 최종 결과가 없습니다.</div>';return}
    archiveList.innerHTML=archives.map((a,i)=>'<div class="archiveRow"><b>'+esc(a.date)+'</b><div class="archiveScores">'+a.names.map((n,j)=>'<b>'+esc(n)+' '+fmt(a.scores[j])+'</b>').join('')+'</div><button type="button" data-del="'+i+'" class="danger">삭제</button></div>').join("");
    archiveList.querySelectorAll("[data-del]").forEach(b=>b.addEventListener("click",()=>{const i=Number(b.dataset.del);if(confirm("이 최종 결과를 삭제하시겠습니까?")){archives.splice(i,1);persist();renderArchive()}}));
  }
  function render(){
    buildEntry();
    head.innerHTML='<tr><th rowspan="2" class="gameno">게임</th><th colspan="2">'+esc(nm(0))+'</th><th colspan="2">'+esc(nm(1))+'</th><th colspan="2">'+esc(nm(2))+'</th></tr><tr><th>'+esc(nm(1))+'</th><th>'+esc(nm(2))+'</th><th>'+esc(nm(0))+'</th><th>'+esc(nm(2))+'</th><th>'+esc(nm(0))+'</th><th>'+esc(nm(1))+'</th></tr>';
    body.innerHTML=games.length?games.map((g,k)=>'<tr><td>'+(k+1)+'</td>'+g.map(v=>'<td>'+(v?fmt(v):"")+'</td>').join("")+'</tr>').join(""):'<tr><td colspan="7" class="muted">아직 기록이 없습니다.</td></tr>';
    const t=totals(); foot.innerHTML='<tr><td class="gameno">누적</td>'+t.map(v=>'<td>'+fmt(v)+'</td>').join("")+'</tr>';
    const rel=[[0,1,0],[0,2,1],[1,2,3]];
    settle.innerHTML=rel.map(([a,b,ix])=>{const v=t[ix];return "<div>"+(v===0?esc(nm(a))+" ↔ "+esc(nm(b))+" : 정산 없음":v>0?esc(nm(b))+" → "+esc(nm(a))+" : "+v+"점":esc(nm(a))+" → "+esc(nm(b))+" : "+Math.abs(v)+"점")+"</div>"}).join("");
    const n=[t[0]+t[1],t[2]+t[3],t[4]+t[5]];
    net.innerHTML=n.map((v,i)=>'<div><small>'+esc(nm(i))+' 순점수</small><b>'+fmt(v)+'</b></div>').join("");
    round.textContent=(games.length+1)+"게임"; undo.disabled=!games.length; reset.disabled=!games.length; archiveSave.disabled=!games.length; save.disabled=false; renderArchive(); persist();
  }
  save.addEventListener("click",()=>{
    const ins=[...entry.querySelectorAll('input[type="number"]')], active=ins.filter(x=>Number(x.value)>0);
    if(!active.length){msg.textContent="승자의 점수를 입력해 주세요.";return}
    const winners=[...new Set(active.map(x=>Number(x.dataset.w)))];
    if(winners.length!==1){msg.textContent="한 판에는 한 명의 승자 칸만 입력해 주세요.";return}
    const w=winners[0], g=Array(6).fill(0);
    active.forEach(x=>{const l=Number(x.dataset.l),v=Math.max(0,Math.min(99999,Math.trunc(Number(x.value)||0))),a=pairs.findIndex(p=>p[0]===w&&p[1]===l),b=pairs.findIndex(p=>p[0]===l&&p[1]===w);g[a]=v;g[b]=-v});
    games.push(g); msg.textContent=games.length+"게임 저장 완료"; render();
  });
  undo.addEventListener("click",()=>{if(games.length){games.pop();msg.textContent="마지막 게임을 취소했습니다.";render()}});
  reset.addEventListener("click",()=>{if(games.length&&confirm("모든 게임 기록을 지우시겠습니까?")){games=[];msg.textContent="모든 기록을 초기화했습니다.";render()}});
  archiveSave.addEventListener("click",()=>{
    if(!games.length)return;
    const t=totals(), scores=[t[0]+t[1],t[2]+t[3],t[4]+t[5]];
    const d=new Date(), date=d.getFullYear()+"." + String(d.getMonth()+1).padStart(2,"0")+"."+String(d.getDate()).padStart(2,"0");
    archives.unshift({date,names:[nm(0),nm(1),nm(2)],scores});
    persist();renderArchive();msg.textContent="오늘 최종 결과를 저장했습니다.";
  });
  names.forEach(x=>x.addEventListener("change",render));
  load(); render();
})();
</script>
</body>
</html>
